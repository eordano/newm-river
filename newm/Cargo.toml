[workspace]
resolver = "3"
members = [
    "newm-river",
    "newm-canvas",
    "newm-kde",
    "newm-river-lock",
    "newm-synth",
    "niri-config",
    "niri-ipc",
]

[workspace.package]
version = "26.4.0"
description = "newm's strict tile canvas as a window manager for the river compositor"
license = "GPL-3.0-or-later"
edition = "2024"
repository = "https://github.com/eordano/newm-river"
rust-version = "1.89"

[workspace.lints.clippy]
new_without_default = "allow"
collapsible_match = "allow"
needless_bool = "allow"
# Edition 2024 on Rust 1.88 and later has let chains; the code niri shares is written without them.
collapsible_if = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.104"
bitflags = "2.13"
clap = { version = "4.6.6", features = ["derive"] }
insta = "1.48.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = { version = "0.1.44", features = ["max_level_trace", "release_max_level_debug"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.18.5", default-features = false }

[workspace.dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "a38bb709a0400759b6a4fab6129e0f1dd72808c3"
default-features = false

[profile.release]
debug = "line-tables-only"
overflow-checks = true
lto = "thin"

[profile.release.package.niri-config]
debug = false
